name: CI

# Runs on every branch and every pull request, so a change is verified even
# when it is not being published. The deploy workflow keeps its own test run as
# the gate before anything reaches the people testing the app.
on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Test
        run: npm test

      # A build failure is a real failure even when nothing is being deployed:
      # the production build applies checks the dev server does not.
      - name: Build
        run: npm run build
